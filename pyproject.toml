[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t2s"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
  "sqlglot>=25",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "faker"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
