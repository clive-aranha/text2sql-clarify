name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shop
      DATABASE_URL: postgresql://readonly:readonly@localhost:5432/shop

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: Create tables and read-only user
        run: |
          psql "$ADMIN_DATABASE_URL" -f db/01_schema.sql
          psql "$ADMIN_DATABASE_URL" -f db/02_roles.sql

      - name: Fill the database with fake data
        run: python scripts/seed.py

      - name: Check code style
        run: ruff check .

      - name: Run tests
        run: python -m pytest -v
